<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral Link - SHS Marketing Pvt. Ltd.</title>
    <link rel="stylesheet" href="referral.css">
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->

        <div class="sidebar">

          <a href="#" onclick="home()">
                <h2>SHS Marketing Pvt. Ltd.</h2>
            </a>

            <ul>
                <li onclick="dashboard()">Dashboard</li>
                <li onclick="Myteam()">My Team</li>
                <!-- <li>Earnings</li> -->
                <!-- <li>Withdraw</li> -->
                <li onclick="referal()">Referral Link</li>
                <li onclick="profile()">Profile</li>
                <li onclick="logout()">Logout</li>
            </ul>

        </div>

        <!-- Main Content -->

        <div class="main">

            <h1>Your Referral Link</h1>

            <div class="referral-box">

                <p>Share this link to invite new members:</p>

                <input id="refLink" type="text" value="https://SHS-Marketing-Pvt.Ltd.com/register?ref=USER123" readonly> 


                <button onclick="copyLink()">Copy Link</button>

            </div>

        </div>

    </div>

    <script>
        function copyLink() {
            let copyText = document.getElementById("refLink");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("Referral link copied!");
        }
    </script>
    <script src="script.js"></script>
</body>

</html>
