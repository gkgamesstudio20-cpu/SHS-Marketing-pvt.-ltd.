<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive MLM Dashboard</title>
    <link rel="stylesheet" href="responsive-dashboard.css">
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->

        <div class="sidebar">

            <h2>MLM Panel</h2>

            <ul>
                <li>Dashboard</li>
                <li>My Team</li>
                <!-- <li>Earnings</li>
                <li>Withdraw</li> -->
                <li>Referral</li>
                <li>Profile</li>
                <li>Logout</li>
            </ul>

        </div>

        <!-- Main Content -->

        <div class="main">

            <h1>Dashboard</h1>

            <div class="cards">

                <div class="card">
                    <h3>Total Earnings</h3>
                    <p>$5200</p>
                </div>

                <div class="card">
                    <h3>Team Members</h3>
                    <p>80</p>
                </div>

                <div class="card">
                    <h3>Direct Referrals</h3>
                    <p>25</p>
                </div>

                <div class="card">
                    <h3>Wallet Balance</h3>
                    <p>$700</p>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
