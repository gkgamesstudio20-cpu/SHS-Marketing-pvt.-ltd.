<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Dropdown</title>
    <link rel="stylesheet" href="notifications.css">
</head>

<body>

    <header class="header">

        <h2>MLM Dashboard</h2>

        <div class="notification-container">

            <div class="bell" onclick="toggleDropdown()">
                🔔
                <span class="count">4</span>
            </div>

            <div id="dropdown" class="dropdown">

                <h4>Notifications</h4>

                <ul>
                    <li>💰 You earned $30 commission</li>
                    <li>👥 New member joined your team</li>
                    <li>✔ Withdraw request approved</li>
                    <li>📢 New update available</li>
                </ul>

            </div>

        </div>

    </header>

    <script src="notifications.js"></script>

</body>

</html>
