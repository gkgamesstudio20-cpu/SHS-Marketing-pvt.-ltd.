<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login - SHS Marketing Pvt. Ltd.</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9169254311637215"
     crossorigin="anonymous"></script>
</head>

<body>


    <div class="login-container">

        <h2>Login</h2>

        <form id="loginForm">

            <label>Mobile Number</label>
            <input type="tel" id="loginMobile" maxlength="10" pattern="[0-9]{10}" inputmode="numeric" placeholder="Enter your Mobile Number"  required> 
           
            <!-- <input type="tel"  id="loginMobile" placeholder="Enter your Mobile number" required> -->

            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>

            <button type="submit">Login</button>

            <p class="register-link">
                Don't have an account? <a href="register.html">Register</a>
            </p>

        </form>
        <script>
            var form = document.getElementById("loginForm");

            form.addEventListener("submit", function (e) {
                e.preventDefault();

                var mobile = document.getElementById("loginMobile").value.trim();
                var password = document.getElementById("loginPassword").value;

                // Validate mobile number
                var mobilePattern = /^[0-9]{10}$/;

                if (!mobilePattern.test(mobile)) {
                    alert("Enter a valid 10-digit mobile number.");
                    return;
                }

                // Fetch user data from SheetDB
                fetch("https://sheetdb.io/api/v1/v1ab6fqkrxpry")
                    .then(response => response.json())
                    .then(data => {

                        // Find matching user
                        var user = data.find(function (item) {
                            return item["Mobile Number"] === mobile &&
                                item["Password"] === password;
                        });

                        if (user) {
                            alert("Login Successful!");

                            // Redirect to dashboard
                            window.location.href = "loginindex.html";
                        } else {
                            alert("Invalid Mobile Number or Password.");
                        }

                    })
                    .catch(error => {
                        console.error(error);
                        alert("Error connecting to server.");
                    });

            });
        </script>

    </div>
    <script src="script.js"></script>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9169254311637215"
     crossorigin="anonymous"></script>
</body>

</html>
