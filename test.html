<!-- test-api.html -->
<!DOCTYPE html>
<html>
<body>
  <h2>Test Registration API</h2>
  <button onclick="testRegister()">Test Register</button>
  <pre id="output"></pre>

  <script>
    const apiURL = "https://script.google.com/macros/s/AKfycbxc_cuvrp3M_DEcKu0ihSGwldSE7MQhxmZ0fWNvQrVwZqhrNGGbqKmeI4DHPWIlQtEC1g/exec";

    async function testRegister() {
      const output = document.getElementById('output');
      output.textContent = "Sending request...";
      
      const data = {
        action: "register",
        firstName: "Test",
        lastName: "User",
        email: "test" + Date.now() + "@example.com",
        mobile: "9876543210", // Change to unique 10-digit number
        password: "testpass123"
      };

      try {
        const response = await fetch(apiURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
          // ⚠️ Do NOT use mode: "no-cors" here - you won't see errors
        });

        const result = await response.json();
        output.textContent = "Response:\n" + JSON.stringify(result, null, 2);
        
        if (result.success) {
          output.textContent += "\n\n✅ Check your Google Sheet now!";
        }
      } catch (error) {
        output.textContent = "❌ Error: " + error.toString();
        console.error("Fetch error:", error);
      }
    }
  </script>
</body>
</html>
