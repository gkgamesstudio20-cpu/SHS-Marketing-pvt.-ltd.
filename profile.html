<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - SHS Marketing Pvt. Ltd.</title>

    <!-- <link rel="stylesheet" href="dashboard.css"> -->
    <link rel="stylesheet" href="profile.css">
</head>

<body>
    <div class="dashboard">

        <!-- Sidebar -->
        <div class="sidebar">
          <a href="#" onclick="home()">
                <h2>SHS Marketing Pvt. Ltd.</h2>
            </a>

            <ul>
                <li onclick="dashboard()">Dashboard</li>
                <li onclick="Myteam()">My Team</li>
                <!-- <li>Earnings</li> -->
                <!-- <li>Withdraw</li> -->
                <li onclick="referal()">Referral Link</li>
                <li onclick="profile()">Profile</li>
                <li onclick="logout()">Logout</li>
            </ul>

        </div>



        <!-- <h2>User Profile</h2> -->


        <form class="profile-form">


            <h3>Personal Information</h3>


            <div class="form-grid">


                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter full name">
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select>
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" placeholder="Enter mobile number">
                </div>

                <div class="form-group">
                    <label>Email ID</label>
                    <input type="email" placeholder="Enter email">
                </div>

                <div class="form-group">
                    <label>State</label>
                    <input type="text" placeholder="Enter state">
                </div>

                <div class="form-group">
                    <label>District</label>
                    <input type="text" placeholder="Enter district">
                </div>

                <div class="form-group">
                    <label>City</label>
                    <input type="text" placeholder="Enter city">
                </div>

                <div class="form-group">
                    <label>Sponsor ID</label>
                    <input type="text" placeholder="Sponsor ID">
                </div>

            </div>


            <h3>Nominee Details</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label>Nominee Name</label>
                    <input type="text">
                </div>

                <div class="form-group">
                    <label>Relation With Nominee</label>
                    <input type="text">
                </div>

                <div class="form-group">
                    <label>Nominee Mobile Number</label>
                    <input type="text">
                </div>

            </div>


            <h3>Bank Details</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label>Account Holder Name</label>
                    <input type="text">
                </div>

                <div class="form-group">
                    <label>Bank Name</label>
                    <input type="text">
                </div>

                <div class="form-group">
                    <label>Account Number</label>
                    <input type="text">
                </div>

                <div class="form-group">
                    <label>IFSC Code</label>
                    <input type="text">
                </div>

                <div class="form-group">
                    <label>Branch</label>
                    <input type="text">
                </div>

            </div>


            <h3>KYC Details</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label>PAN Number</label>
                    <input type="text">
                </div>

                <div class="form-group">
                    <label>Aadhar Card Number</label>
                    <input type="text">
                </div>

            </div>

            <button class="save-btn" onclick="dashboard()">Save Profile</button>

        </form>

    </div>

    <script src="script.js"></script>
</body>

</html>
