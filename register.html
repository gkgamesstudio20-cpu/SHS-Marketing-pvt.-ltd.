<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SHS Marketing Pvt. Ltd.</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>




    <div class="container">
        <header class="header">
            <h1 class="site-title">SHS Marketing Pvt. Ltd.</h1>
            <p class="site-tagline">Grow Your Business With Our Network</p>
        </header>

        <h2>Create Account</h2>

        <form action="https://sheetdb.io/api/v1/v1ab6fqkrxpry" method="post" id="sheetdb">




            <label>Mobile Number</label>
            <input type="tel" id="mobile" maxlength="10" pattern="[0-9]{10}" inputmode="numeric"
                placeholder="Enter your Mobile Number" name="data[Mobile Number]" required>

            <!-- <input type="tel" placeholder="Enter your Mobile Number" name="data[Mobile Number]" required> -->

            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password" name="data[Password]" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" name="data[Confirm Password]"
                required>

            <label>Referral ID</label>
            <input type="text" id="referralId" placeholder="Enter referral ID" name="data[Referral ID]">

            <button type="submit">Register</button>


            <p class="login-link">
                Already have an account? <a href="#" onclick="login()">Login</a>
            </p>

        </form>

        <script>
            var form = document.getElementById('sheetdb');

            form.addEventListener("submit", function (e) {
                e.preventDefault();

                var mobile = document.getElementById("mobile").value.trim();
                var password = document.getElementById("password").value;
                var confirmPassword = document.getElementById("confirmPassword").value;
                var referralId = document.getElementById("referralId").value.trim();

                var mobilePattern = /^[0-9]{10}$/;

                // 1. Mobile validation
                if (!mobilePattern.test(mobile)) {
                    alert("Mobile number must be exactly 10 digits.");
                    return;
                }

                // 2. Password match validation
                if (password !== confirmPassword) {
                    alert("Password and Confirm Password must be the same.");
                    return;
                }

                // Get all users from SheetDB
                fetch("https://sheetdb.io/api/v1/v1ab6fqkrxpry")
                    .then(response => response.json())
                    .then(data => {

                        // 3. Check duplicate mobile
                        var mobileExists = data.some(function (item) {
                            return item["Mobile Number"] === mobile;
                        });

                        if (mobileExists) {
                            alert("This mobile number is already registered.");
                            return;
                        }

                        // 4. Check referral ID exists (if entered)
                        if (referralId !== "") {

                            var referralExists = data.some(function (item) {
                                return item["User ID"] === referralId;
                            });

                            if (!referralExists) {
                                alert("Invalid Referral ID.");
                                return;
                            }
                        }

                        // 5. Generate new User ID
                        var userId = "SHS" + Date.now();

                        var formData = new FormData(form);

                        formData.append("data[User ID]", userId);

                        // Submit data
                        fetch(form.action, {
                            method: "POST",
                            body: formData,
                        })
                            .then(response => response.json())
                            .then((data) => {
                                alert("Registration Successful! Your User ID is: " + userId);
                                window.location.href = "Login.html";
                            });

                    })
                    .catch(error => {
                        console.error(error);
                        alert("Server error.");
                    });

            });
        </script>

    </div>

    <script src="script.js"></script>
</body>

</html>
