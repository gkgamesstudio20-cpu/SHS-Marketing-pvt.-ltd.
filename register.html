<!DOCTYPE html>
<html>

<head>
    <title>Register - SHS Marketing Pvt. Ltd.</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>




    <div class="container">
        <header class="header">
            <h1 class="site-title">SHS Marketing Pvt. Ltd.</h1>
            <p class="site-tagline">Grow Your Business With Our Network</p>
        </header>

        <h2>Create Account</h2>

        <form>




            <label>Mobile Number</label>
            <input type="tel" placeholder="Enter your Mobile Number" required>

            <label>Password</label>
            <input type="password" placeholder="Enter password" required>

            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm password" required>

            <label>Referral ID</label>
            <input type="text" placeholder="Enter referral ID">

            <button type="submit">Register</button>


            <p class="login-link">
                Already have an account? <a href="#" onclick="login()">Login</a>
            </p>

        </form>

    </div>

    <script src="script.js"></script>
</body>

</html>
