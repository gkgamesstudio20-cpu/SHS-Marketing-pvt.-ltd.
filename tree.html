        <ul>

            <li>

                    <li>

                                <div class="member">Member B</div>
                            </li>
                        </ul>

                    </li>

                    <li>
                        <div class="member">Right Member</div>

                        <ul>
                            <li>
                                <div class="member">Member C</div>
                            </li>
                            <li>
                                <div class="member">Member D</div>
                            </li>
                        </ul>

                    </li>

                </ul>

            </li>

        </ul>

    </div>
